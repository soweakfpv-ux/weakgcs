; weakgcs configuration. Copied next to the executable at build time.

[network]
; Static IP of the mast (firmware/mast/src/config.h). Set the laptop's Ethernet port to 192.168.77.1/24.
mast_ip = 192.168.77.2
mast_port = 5770

[rc]
; How often RC packets are sent to the mast. The mast resamples to the ELRS packet rate,
; so this only needs to be >= the ELRS rate (500 Hz for 500 Hz / F500 modes).
rate_hz = 500
; Part of the joystick name (case-insensitive), e.g. "radiomaster" or "edgetx". Empty = first
; joystick found. The name is printed at startup.
joystick =
; Arm channel (1-based, AUX1 = 5). Held low until the radio is seen disarmed, after start or
; after the radio was reconnected. 0 = disabled.
arm_channel = 5
; One token per channel, starting at ch1:  aN = axis N, -aN = inverted, bN = button N,
; cN = constant (CRSF ticks 172..1811), uN = constant (microseconds). Missing = centered.
; EdgeTX "Classic" USB joystick: ch1..ch8 -> 8 axes. Check with F2 (channel monitor).
channels = a0 a1 a2 a3 a4 a5 a6 a7

[video]
; Part of the capture device name. Empty = first device found.
device =
; 0 = choose automatically (highest frame rate).  Analog grabbers: PAL 720x576@25, NTSC 720x480@30.
width = 0
height = 0
fps = 0
; Video receiver channel set through the mast (original Skyzone SteadyView over SPI), e.g. R1, F4.
; Empty = don't control it. Change at runtime with Ctrl+Left/Right (channel), Ctrl+Up/Down (band).
vrx_channel =
; vsync = 1 removes tearing but adds up to one display refresh of latency.
vsync = 0
fullscreen = 0

[osd]
; 0 = detect from voltage.
battery_cells = 0
cell_warn_voltage = 3.5
lq_warn = 70
