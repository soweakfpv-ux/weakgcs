; Mast firmware: UDP (from GCS laptop over Ethernet) -> CRSF (to ELRS TX module).
;
; Build:   pio run -e esp32-poe
; Flash:   pio run -e esp32-poe -t upload
; Monitor: pio device monitor

[platformio]
default_envs = esp32-poe

[env]
; Arduino-ESP32 2.0.x (the ETH/timer APIs used here changed in 3.x)
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -I${PROJECT_DIR}/../../common/include

; Olimex ESP32-POE / ESP32-POE-ISO (recommended: Ethernet + PoE on one board)
[env:esp32-poe]
board = esp32-poe
build_flags =
    ${env.build_flags}
    -DWGCS_BOARD_OLIMEX_POE

; WT32-ETH01 (cheaper, needs a separate PoE splitter / 5 V supply)
[env:wt32-eth01]
board = wt32-eth01
build_flags =
    ${env.build_flags}
    -DWGCS_BOARD_WT32_ETH01
